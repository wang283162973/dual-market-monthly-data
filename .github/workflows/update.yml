name: Update fifteen monthly indicators

on:
  workflow_dispatch:
  schedule:
    - cron: "20,50 1-3,5-7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_market_data.py
        env:
          EM_API_KEY: ${{ secrets.EM_API_KEY }}
      - name: Commit changed data
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add public/data.json state/current_month.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/wang283162973/dual-market-monthly-data@main/public/data.json"
